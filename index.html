<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comptoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#ECF0EA; --ink:#1D2621; --muted:#68746D; --line:#E2E7E0; --cardline:transparent;
  --accent:#2F6A50; --accent-ink:#FFFFFF; --accent-soft:#E0EEE5;
  --good:#23805A; --good-soft:#DFF2E7; --warn:#946000; --warn-soft:#FAEFD8; --bad:#BF3F36; --bad-soft:#FBE4E0; --info:#4B63B8; --info-soft:#E7ECFA;
  --av1:#E1EEDD; --av2:#F7E7D8; --av3:#E2E9F6; --av4:#F3E1EB; --av5:#EEEAD6;
  --shadow:0 1px 2px rgba(29,38,33,.04),0 10px 30px rgba(29,38,33,.06);
  --r:20px;
  color-scheme:light;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* ---- structure ---- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{padding:26px 18px 20px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;padding-inline:8px}
.logo{width:30px;height:30px;border-radius:10px 10px 10px 3px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px;flex:none}
.biz{background:var(--surface);border:1px solid var(--cardline);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.biz b{font-weight:700;font-size:14px;line-height:1.25}
.biz select{width:100%}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px 6px}
.nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;color:var(--muted);font-weight:500;width:100%}
.nav span{flex:1}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav:focus-visible{outline:2px solid var(--accent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding-inline:10px;display:flex;flex-direction:column;gap:4px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
.badge{font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;background:var(--bad);color:var(--surface)}
.badge.soft{background:var(--sunk);color:var(--muted)}

main{padding:30px 34px 64px;max-width:1220px;width:100%;display:flex;flex-direction:column;gap:20px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.025em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:13px;margin:0;font-weight:600}
.mtop,.tabbar{display:none}

/* ---- blocs ---- */
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.grid2.wide{grid-template-columns:minmax(0,2.3fr) minmax(0,1fr)}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--cardline);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero{background:radial-gradient(90% 120% at 100% 0%,var(--accent-soft) 0,transparent 60%),var(--surface);padding:24px}
.hello{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.lead{font-size:15.5px;line-height:1.55;margin:0;max-width:62ch;color:var(--ink)}
.lead strong{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.hero .stat{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .d{font-size:12px;font-weight:600;color:var(--muted)}
.up{color:var(--good)!important} .down{color:var(--bad)!important}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:14px;padding:10px 12px;margin:0}
.empty{color:var(--muted);padding:10px 0;font-size:13.5px;margin:0}

.btn{border:0;background:var(--sunk);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--accent)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:none;padding:7px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:13px;color:var(--muted);border:1px solid var(--cardline);white-space:nowrap}
.chip small{font-weight:500;opacity:.8;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip:focus-visible{outline:2px solid var(--accent)}
.slot{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.slot:hover{background:var(--accent);color:var(--accent-ink)}
.slots{display:flex;flex-wrap:wrap;gap:6px}

.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px;margin:-4px -2px -6px}
.days::-webkit-scrollbar{display:none}
.day{all:unset;cursor:pointer;flex:none;min-width:64px;padding:10px 8px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:0;border:1px solid var(--cardline)}
.day span{font-size:12px;color:var(--muted);font-weight:500}
.day b{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2}
.day small{font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] span,.day[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.day.closed{opacity:.55}
.day:focus-visible{outline:2px solid var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* listes */
.items{display:flex;flex-direction:column;gap:2px;margin-inline:-10px}
.item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;width:100%;min-width:0}
button.item,.item.click{cursor:pointer}
button.item:hover,.item.click:hover{background:var(--sunk)}
.item:focus-visible{outline:2px solid var(--accent)}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column}
.item .main b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .main>span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{display:flex;align-items:center;gap:8px;flex:none;text-align:right}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.time{min-width:54px;display:flex;flex-direction:column;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;flex:none}
.time small{font-size:11px;color:var(--muted);font-weight:500}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;color:var(--ink)}
.ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted)}
.ico.bad{background:var(--bad-soft);color:var(--bad)} .ico.warn{background:var(--warn-soft);color:var(--warn)} .ico.info{background:var(--info-soft);color:var(--info)} .ico.good{background:var(--good-soft);color:var(--good)} .ico.acc{background:var(--accent-soft);color:var(--accent)}
.chev{color:var(--muted);opacity:.6}
.dayhead{font-size:12px;font-weight:600;color:var(--muted);padding:12px 10px 2px;text-transform:capitalize}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.qty{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:3px}
.qty button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface)}
.qty b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* graphiques */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .ax.dim{opacity:.7}
.chart .bar{fill:var(--accent);opacity:.35}
.chart .bar.last{opacity:1}
.chart .val{fill:var(--ink);font-size:11.5px;font-weight:700;font-family:var(--body)}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:5px}
.hbar .fill.alt{background:var(--info)}
.hbar span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* agenda */
.scroll-x{overflow-x:auto}
.agenda{display:grid;min-width:520px}
.agenda .col{position:relative}
.agenda .col+.col{border-left:1px solid var(--line)}
.agenda .head{font-weight:600;font-size:13px;padding:0 10px 10px;display:flex;justify-content:space-between;gap:6px}
.agenda .body{position:relative;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 52px)}
.agenda .hours .body{background:none}
.agenda .hours span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-8px);font-variant-numeric:tabular-nums}
.agenda .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px)}
.blk{all:unset;cursor:pointer;position:absolute;left:5px;right:5px;border-radius:12px;padding:5px 9px;font-size:12px;line-height:1.3;overflow:hidden;background:var(--accent-soft);box-sizing:border-box}
.blk b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:var(--muted);white-space:nowrap}
.blk.attente{background:var(--warn-soft)} .blk.arrive{background:var(--good-soft)}
.blk.absent{background:var(--bad-soft);text-decoration:line-through}
.blk.termine{background:var(--sunk);opacity:.75}
.blk:hover{filter:brightness(.97)}
.blk:focus-visible{outline:2px solid var(--accent)}
.now-line{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:2}
.now-line::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* salle */
.room{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;background:var(--sunk);border-radius:18px;overflow:hidden;background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:20px 20px}
.tbl{all:unset;cursor:pointer;position:absolute;display:grid;place-items:center;text-align:center;border-radius:16px;font-weight:700;font-size:13px;box-sizing:border-box;line-height:1.15;border:2px solid transparent;box-shadow:var(--shadow)}
.tbl small{display:block;font-weight:500;font-size:10.5px;opacity:.85}
.tbl.round{border-radius:50%}
.tbl.libre{background:var(--surface)}
.tbl.reservee{background:var(--info-soft);color:var(--info)}
.tbl.occupee{background:var(--accent);color:var(--accent-ink)}
.tbl.nettoyer{background:var(--warn-soft);color:var(--warn);border:2px dashed var(--warn);box-shadow:none}
.tbl.sel{outline:3px solid var(--ink);outline-offset:3px}
.fixture{position:absolute;display:grid;place-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border:1.5px dashed var(--line);border-radius:14px}

/* planning */
.plan{border-collapse:separate;border-spacing:5px;width:100%;font-size:13px}
.plan th{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:0 4px 4px;white-space:nowrap}
.plan th:first-child{text-align:left}
.plan td{padding:0}
.plan td.r{text-align:right;padding-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.shift{all:unset;cursor:pointer;display:block;text-align:center;padding:9px 6px;border-radius:12px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--ink);white-space:nowrap;box-sizing:border-box;width:100%}
.shift.s1{background:var(--info-soft)}
.shift.s2{background:var(--accent);color:var(--accent-ink)}
.shift.s3{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.shift.closed{cursor:default;background:transparent;color:var(--muted);font-weight:500;opacity:.6}
.shift:focus-visible{outline:2px solid var(--accent)}
.pday{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.pday+.pday{border-top:1px solid var(--line)}
.pday .shift{display:inline-block;width:auto;padding:7px 12px;border-radius:999px}
.pday .row{gap:6px}

/* formulaires */
input[type=text],input[type=number],input[type=time],input[type=search],select,textarea{background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.biz select,select.mini{padding:7px 10px;font-size:13.5px;font-weight:600}
textarea{min-height:130px;resize:vertical;line-height:1.5}
input[type=file]{font-size:13px;max-width:100%}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.search{position:relative;flex:1;max-width:380px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px;background:var(--surface);box-shadow:var(--shadow)}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(16px)}
.toggle{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;cursor:pointer}
.toggle+.toggle{border-top:1px solid var(--line)}
.toggle b{font-weight:600;display:block}
.toggle span span{display:block}

.reco{display:flex;gap:12px;padding:12px 0}
.reco+.reco{border-top:1px solid var(--line)}
.reco .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
details.card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary svg{transform:rotate(90deg)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sunk);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:96px;position:relative}
.tile:hover{filter:brightness(.97)}
.tile b{font-weight:600;line-height:1.3}
.tile small{color:var(--muted);font-size:12px;display:block;font-weight:500}
.tile .badge{position:absolute;top:12px;right:12px}
.tile[aria-current="page"]{box-shadow:inset 0 0 0 2px var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent)}

/* panneau */
#overlay{position:fixed;inset:0;background:rgba(14,20,16,.36);z-index:50;display:flex;justify-content:flex-end}
#sheet{background:var(--surface);width:min(470px,100%);height:100%;overflow:auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:16px;border-radius:24px 0 0 24px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:21px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.info-list{display:flex;flex-direction:column;background:var(--sunk);border-radius:16px;padding:4px 14px}
.info-list div{display:flex;justify-content:space-between;gap:10px;padding:9px 0}
.info-list div+div{border-top:1px solid var(--line)}
.info-list span{color:var(--muted)}
.statusrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.statusrow .btn{justify-content:center}
.btn.on{background:var(--ink);color:var(--bg)}

.only-mob{display:none!important}
@media (max-width:1020px){
  .grid2,.grid2.wide,.grid2e{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .only-desk{display:none!important}
  .only-mob{display:flex!important}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
  .mtop .brand{font-size:19px;padding:0;gap:8px}
  .mtop .logo{width:26px;height:26px;font-size:14px}
  .mtop select{width:auto;max-width:52vw;background:var(--surface);box-shadow:var(--shadow)}
  main{padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px));gap:16px}
  h1{font-size:26px}
  .top{align-items:center}
  .card{padding:16px;border-radius:18px}
  .hero{padding:18px}
  .hello{font-size:22px}
  .lead{font-size:14.5px}
  .stats{gap:8px}
  .stat{padding:10px 11px;border-radius:14px}
  .stat .v{font-size:18px}
  .stat .d{font-size:11px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .hbar{grid-template-columns:84px minmax(0,1fr) 66px;font-size:12.5px}
  .hide-m{display:none!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  .tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
  .tab[aria-current="page"]{color:var(--accent)}
  .tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .tab.plus span{display:none}
  .tab.plus i{width:50px;height:50px;border-radius:18px 18px 18px 6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
  #overlay{align-items:flex-end}
  #sheet{height:auto;max-height:92%;border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px))}
  #sheet::before{content:"";align-self:center;width:42px;height:5px;border-radius:3px;background:var(--line);flex:none}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .items{margin-inline:-8px}
  .item{padding:10px 8px;gap:11px}
}
@media (max-width:480px){
  .stats{grid-template-columns:minmax(0,1fr)!important;gap:6px}
  .stat{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:10px 14px}
  .stat .k{grid-column:1;grid-row:1}
  .stat .d{grid-column:1;grid-row:2}
  .stat .v{grid-column:2;grid-row:1/3;font-size:20px}
  .time{min-width:46px}
}
@media (prefers-reduced-motion:no-preference){
  #sheet{animation:slide .2s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.5}to{transform:none;opacity:1}}
  @media (max-width:760px){@keyframes slide{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}}
  #view>*{animation:fade .22s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}

  // factures en attente
  const INV={snack:[['Mairie — plateaux repas conseil municipal',186,-18,1],['BatiNord — déjeuners équipe septembre',342,-9,0],['Club de foot U13 — goûter de rentrée',95,-36,2]],

  INV.forEach(([l,a,d,lv],i)=>S.invoices.push({id:id(),client:S.clients[8+i].name,label:l,amount:a,due:iso(dAdd(d)),level:lv,paid:false}));
  // stock
  const ST={snack:[['Pain pita (sachet de 50)',3,4,'sachets','Metro',3],['Broche kebab 10 kg',2,2,'broches','Metro',4],['Frites surgelées',6,4,'cartons','Metro',null],['Tomates',4,5,'kg','Primeur Halles',5],['Salade iceberg',3,3,'kg','Primeur Halles',2],['Sauce blanche maison (base)',5,3,'bidons','Metro',9],['Canettes 33 cl',96,72,'unités','France Boissons',null],['Barquettes kraft',180,300,'unités','Emballages Pro',null],['Huile de friture 25 L',2,2,'bidons','Metro',null]],
    coiffeur:[['Shampoing pro 1 L',5,4,'flacons','Grossiste coiffure',null],['Coloration 6.0 châtain',3,6,'tubes','Grossiste coiffure',null],['Oxydant 20 vol.',2,3,'litres','Grossiste coiffure',null],['Masque réparateur',7,4,'pots','Grossiste coiffure',null],['Laque fixation forte',4,6,'bombes','Grossiste coiffure',null],['Serviettes jetables',120,200,'unités','Blanchisserie',null],['Cire à barbe',3,2,'pots','Grossiste coiffure',null]],
    auto:[['Livrets d’apprentissage',8,10,'livrets','Éditions Code',null],['Fiches de suivi élève',45,30,'fiches','Éditions Code',null],['Livres de code 2026',14,10,'livres','Éditions Code',null],['Clio GH-418-KT — avant révision',850,1000,'km','Garage Central',null],['208 FR-902-LM — avant révision',6400,1000,'km','Garage Central',null],['Clio GK-771-PA — avant révision',3100,1000,'km','Garage Central',null],['Gilets & triangles de rechange',3,3,'kits','Garage Central',null]]}[m]||EXTRA[m].ST;
  ST.forEach(([n,q,mi,u,s,dlc])=>S.stock.push({id:id(),item:n,qty:q,min:mi,unit:u,supplier:s,dlc:dlc===null?null:iso(dAdd(dlc))}));
  if(M.type==='resto'){
    S.tables=[{id:'T1',seats:2,x:5,y:9,w:12,h:19,round:1},{id:'T2',seats:2,x:22,y:9,w:12,h:19,round:1},{id:'T3',seats:4,x:40,y:8,w:17,h:21},{id:'T4',seats:4,x:62,y:8,w:17,h:21},{id:'T5',seats:6,x:5,y:52,w:26,h:24},{id:'T6',seats:4,x:37,y:54,w:17,h:21},{id:'T7',seats:2,x:59,y:56,w:11,h:18,round:1}]

const openDay=ds=>!M().closed.includes(wdi(fromIso(ds)));
const salesFor=prefix=>{
  const days=S.days.filter(d=>d.date.startsWith(prefix));
  const extra=S.entries.filter(e=>e.dir==='in'&&e.date.startsWith(prefix));
  return {days,extra,ttc:sum(days,d=>d.rev)+sum(extra,e=>e.ttc),clients:sum(days,d=>d.clients)+extra.length,noshow:sum(days,d=>d.noshow)};
};
function ledger(prefix){
  const t=M().tva;
  const rows=S.days.filter(d=>d.date.startsWith(prefix)).map(d=>({id:'d'+d.date,date:d.date,label:'Encaissements du jour ('+d.clients+' '+M().L.client+'s)',cat:'Ventes',dir:'in',ttc:d.rev,tva:t,auto:true,proof:'Z de caisse'}));
  return rows.concat(S.entries.filter(e=>e.date.startsWith(prefix))).sort((a,b)=>b.date.localeCompare(a.date)||(a.dir==='in'?-1:1));
}
function accounts(prefix){
  const L=ledger(prefix);
  const ins=L.filter(e=>e.dir==='in'),outs=L.filter(e=>e.dir==='out');
  const ht=e=>e.ttc/(1+e.tva/100),tv=e=>e.ttc-ht(e);
  const caTTC=sum(ins,e=>e.ttc),caHT=sum(ins,ht),tvaC=sum(ins,tv);
  const chTTC=sum(outs,e=>e.ttc),chHT=sum(outs,ht),tvaD=sum(outs,tv);
  const cats={};outs.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+ht(e));
  return {L,ins,outs,caTTC,caHT,tvaC,chTTC,chHT,tvaD,tvaNet:tvaC-tvaD,res:caHT-chHT,cats,missing:outs.filter(e=>!e.proof).length};
}

const shortE=v=>v>=1000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' k€':Math.round(v)+' €';
function barChart(data,W=660,H=230){
  const L=46,R=6,T=22,B=38,max=niceMax(Math.max(...data.map(d=>d.v),1)),n=data.length,bw=(W-L-R)/n,ih=H-T-B;
  let g='';
  for(let i=0;i<=3;i++){const y=T+ih*(1-i/3);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid"${i?' stroke-dasharray="2 4"':''}/><text x="${L-8}" y="${y+4}" text-anchor="end" class="ax">${shortE(max*i/3)}</text>`}
  data.forEach((d,i)=>{
    const w=Math.min(bw*0.62,34),x=L+i*bw+(bw-w)/2,h=ih*d.v/max,y=H-B-h,cx=x+w/2,rr=Math.min(8,w/2,h);
    if(d.closed)g+=`<text x="${cx}" y="${H-B-6}" text-anchor="middle" class="ax dim">fermé</text>`;
    else{g+=`<path d="M${x},${H-B} V${y+rr} Q${x},${y} ${x+rr},${y} H${x+w-rr} Q${x+w},${y} ${x+w},${y+rr} V${H-B} Z" class="bar${i===n-1?' last':''}"><title>${esc(d.title)}</title></path>`;
      if(i===n-1)g+=`<text x="${cx}" y="${y-6}" text-anchor="middle" class="val">${shortE(d.v)}</text>`}
    g+=`<text x="${cx}" y="${H-B+16}" text-anchor="middle" class="ax">${d.label}</text><text x="${cx}" y="${H-B+30}" text-anchor="middle" class="ax dim">${d.sub}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Ventes par jour">${g}</svg>`;
}
function hbars(rows,alt){const max=Math.max(...rows.map(r=>r[1]),1);return `<div class="stack" style="gap:10px">${rows.map(([k,v,lab])=>`<div class="hbar"><span>${esc(k)}</span><div class="track"><div class="fill${alt?' alt':''}" style="width:${(v/max*100).toFixed(1)}%"></div></div><span>${lab??eur0(v)}</span></div>`).join('')}</div>`}
const stat=(k,v,d,cls)=>`<div class="stat"><span class="k">${k}</span><span class="v">${v}</span>${d?`<span class="d ${cls||''}">${d}</span>`:''}</div>`;
const chips=(act,cur,opts)=>`<div class="chips" role="group">${opts.map(([v,l,s])=>`<button class="chip" data-act="${act}" data-v="${esc(v)}" aria-pressed="${v===cur}">${l}${s!==undefined?`<small>${s}</small>`:''}</button>`).join('')}</div>`;
function bookingItem(b,showDay){

  const H0=8,H1=20,PX=52;
  const cols=staff.map(st=>{

    else{if(sh[2]>H0)off+=`<div class="off" style="top:0;height:${(sh[2]-H0)*PX}px"></div>`;if(sh[3]<H1)off+=`<div class="off" style="top:${(sh[3]-H0)*PX}px;height:${(H1-sh[3])*PX}px"></div>`}

      ${TY()==='lecon'?`<p class="note">${Object.entries(m.vehicles).filter(([k])=>staff.includes(k)).map(([k,v])=>esc(k)+' : '+esc(v)).join('<br>')}</p>`:''}
    </section></div>`;

function freeSlots(st,ds){
  const m=M(),sh=m.shifts[S.plan[st][wdi(fromIso(ds))]];if(!sh[1])return[];
  const step=TY()==='lecon'?60:30,dur=step,bs=S.bookings.filter(b=>b.date===ds&&b.staff===st&&b.status!=='absent'),out=[];
  for(let t=sh[2]*60;t+dur<=sh[3]*60;t+=step){
    if(TY()==='lecon'&&t===720)continue;
    if(ds===iso(TODAY)&&t<NOWMIN)continue;
    if(!bs.some(b=>{const s=toMin(b.time);return t<s+b.dur&&s<t+dur}))out.push(toT(t));
  }
  return out;
}

    ...cov.map((c,i)=>c!==null&&c<need(i)?['bad','users',`${cap(WDL[i])} : ${c} personne${c>1?'s':''}`,`Jour chargé, environ ${m.base[i]} ${m.L.client}s en moyenne.`]:null).filter(Boolean),
    ...(cf.length?[['bad','cal',`${cf.length} ${unit(cf.length)} avec quelqu'un en repos`,cf.slice(0,3).map(b=>b.staff+' '+relDay(b.date)+' '+b.time).join(' · ')]]:[])
  ];
  const cost=sum(m.staff,s=>{const h=hoursOf(s);return Math.min(h,35)*16.5+Math.max(h-35,0)*16.5*1.25});
  return `<section class="card"><header><h2>Semaine du ${d0.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</h2><span class="muted small">Touchez un créneau pour le changer</span></header>

  <div class="grid2e">
    <section class="card"><header><h2>Vérifications</h2></header>${checks.length?`<div class="items">${checks.map(c=>`<div class="item"><span class="ico ${c[0]}">${ic(c[1],18)}</span><span class="main"><b>${esc(c[2])}</b><span style="white-space:normal">${esc(c[3])}</span></span></div>`).join('')}</div>`:`<div class="items"><div class="item"><span class="ico good">${ic('check',18)}</span><span class="main"><b>Planning conforme</b><span>Heures, repos et effectifs sont bons.</span></span></div></div>`}</section>
    <section class="card"><header><h2>Heures de la semaine</h2></header>${hbars(m.staff.map(s=>[s,hoursOf(s),hfmt(hoursOf(s))]))}
      <p class="small muted" style="margin:0">Coût brut estimé : <b style="color:var(--ink)">${eur0(cost)}</b>, soit ${Math.round(cost/Math.max(sum(lastNDays(7),d=>d.rev),1)*100)} % des ventes de la semaine dernière (base 16,50 €/h).</p></section>
  </div>`;
};

  const f=F[UI.clflt]||F.all;

  <div class="spread"><label class="search"><span class="sr" hidden>Rechercher</span>${ic('search',18)}<input type="search" id="q" placeholder="Nom ou téléphone" value="${esc(UI.q)}" aria-label="Rechercher"></label>${chips('clflt',UI.clflt,opts)}</div>

V.bilan=()=>{
  const m=M(),p=UI.month,cur=iso(TODAY).slice(0,7),isCur=p===cur,A=accounts(p);
  const lastDay=isCur?TODAY.getDate():new Date(+p.slice(0,4),+p.slice(5,7),0).getDate();
  const pp=prevMonth(p),AP=accounts(pp);
  const partial=pre=>ledger(pre).filter(e=>e.dir==='in'&&fromIso(e.date).getDate()<=lastDay);
  const caNow=sum(partial(p),e=>e.ttc),caPrev=sum(partial(pp),e=>e.ttc),evo=caPrev?caNow/caPrev-1:0;
  const sl=salesFor(p),pan=A.caTTC/Math.max(sl.clients,1);
  const wk=[...Array(7)].map((_,i)=>{const ds=S.days.filter(d=>wdi(fromIso(d.date))===i&&diffDays(d.date)>=-56);return[WDL[i],ds.length?sum(ds,d=>d.rev)/ds.length:0]}).filter((x,i)=>!m.closed.includes(i));
  const best=[...wk].sort((a,b)=>b[1]-a[1])[0],worst=[...wk].sort((a,b)=>a[1]-b[1])[0];
  const cats=Object.entries(A.cats).sort((a,b)=>b[1]-a[1]),pays=m.pay.map(([k,f])=>[k,A.caTTC*f]);
  const nsRate=sl.noshow/Math.max(sl.clients+sl.noshow,1),reco=[];
  if(best&&worst&&worst[1]<best[1]*0.7)reco.push([`Le ${worst[0]} rapporte ${Math.round((1-worst[1]/best[1])*100)} % de moins que le ${best[0]}.`,TY()==='resto'?`Testez une formule du ${worst[0]} (menu + boisson à prix réduit) annoncée par SMS aux clients fidèles.`:TY()==='rdv'?`Proposez −15 % le ${worst[0]} matin aux clients inactifs.`:`Placez les évaluations de départ et les rendez-vous pédagogiques le ${worst[0]}.`]);
  if(TY()!=='resto'&&nsRate>0.04)reco.push([`${sl.noshow} absences, environ ${eur0(sl.noshow*m.avg)} perdus.`,`Demandez un acompte à la réservation en ligne et gardez le rappel SMS de la veille.`]);
  if(TY()==='resto'){const mp=(A.cats['Matières premières']||0)+(A.cats['Boissons']||0),r=mp/Math.max(A.caHT,1);reco.push([`Coût matière : ${Math.round(r*100)} % des ventes HT.`,r>0.32?'C’est au-dessus de 30 %. Vérifiez les portions et les pertes sur les produits frais.':'C’est dans la bonne fourchette pour un snack (25 à 32 %).'])}
  const od=overdue();if(od.length)reco.push([`${eur0(sum(od,i=>i.amount))} d'impayés en attente.`,'Les relances sont prêtes dans l’onglet Relances.']);
  if(A.missing)reco.push([`${A.missing} dépense${A.missing>1?'s':''} sans justificatif.`,'Sans facture, la TVA de ces achats n’est pas déductible.']);
  reco.push([`Mettez ${eur0(A.tvaNet)} de côté pour la TVA.`,`TVA nette de ${monthName(p).toLowerCase()}, à déclarer sur impots.gouv.`]);
  const summary=`<strong>${monthName(p)}${isCur?' (au '+lastDay+')':''}</strong> : ${eur0(A.caTTC)} de ventes pour ${sl.clients} ${m.L.client}s, soit ${eur(pan)} par ${m.L.client}. ${caPrev?`C'est <strong class="${evo>=0?'up':'down'}">${pct(evo)}</strong> par rapport au mois précédent à date égale. `:''}Après ${eur0(A.chHT)} de charges, il reste <strong>${eur0(A.res)}</strong> avant impôt. Le meilleur jour reste le ${best?best[0]:'—'}.`;
  return `${monthChips()}
  <section class="card hero"><span class="muted small">Rédigé automatiquement ${isCur?'ce matin à 7 h':'le 1er du mois suivant'}</span><p class="lead" id="bilanText">${summary}</p>
    <div class="stats">${stat('Ventes TTC',eur0(A.caTTC),caPrev?pct(evo):'',evo>=0?'up':'down')}${stat('Charges HT',eur0(A.chHT),Math.round(A.chHT/Math.max(A.caHT,1)*100)+' % des ventes')}${stat('Résultat HT',eur0(A.res),'avant : '+eur0(AP.res))}</div></section>
  <div class="grid2e">
    <section class="card"><header><h2>Conseils du mois</h2></header><div>${reco.map((r,i)=>`<div class="reco"><span class="n">${i+1}</span><div><b>${esc(r[0])}</b><div class="muted small">${esc(r[1])}</div></div></div>`).join('')}</div></section>
    <div class="stack">
      <section class="card"><header><h2>Ventes moyennes par jour</h2><span class="muted small">8 semaines</span></header>${hbars(wk.map(([k,v])=>[cap(k),v]))}</section>
      <section class="card"><header><h2>Où part l'argent</h2><span class="muted small">HT</span></header>${cats.length?hbars(cats,true):'<p class="empty">Aucune charge.</p>'}</section>
      <section class="card"><header><h2>Moyens de paiement</h2></header>${hbars(pays)}</section>
    </div>
  </div>
  <section class="card"><label class="toggle"><span><b>Recevoir ce bilan par e-mail</b><span class="muted small">Chaque lundi et le 1er du mois, avec l'export pour le comptable.</span></span><input type="checkbox" class="sw" id="tgBilan" data-act-change="auto" data-k="bilan" ${S.auto.bilan?'checked':''}></label></section>`;
};

/* ---------- panneaux ---------- */
function openSheet(title,html){$('#sheet').innerHTML=`<div class="sheet-head"><h2>${title}</h2><button class="iconbtn" data-act="close" aria-label="Fermer">${ic('x',18)}</button></div>`+html;$('#overlay').hidden=false;$('#sheet').scrollTop=0}
function closeSheet(){$('#overlay').hidden=true;$('#sheet').innerHTML=''}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}
function copy(text){
  const fallback=()=>{openSheet('Copier le texte',`<p class="muted small" style="margin:0">Sélectionnez le texte ci-dessous puis copiez-le.</p><textarea id="cpy" readonly style="min-height:300px">${esc(text)}</textarea>`);setTimeout(()=>{const t=$('#cpy');t&&t.select()},50)};
  try{navigator.clipboard.writeText(text).then(()=>toast('Copié'),fallback)}catch(e){fallback()}

function render(){
  const m=M(),secs=SECTIONS();
  if(!secs.some(s=>s.k===tab))tab='dash';
  const groups_=[...new Set(Object.values(MODES).map(x=>x.group))];
  document.querySelectorAll('.modesel').forEach(s=>{if(!s.options.length||s.options.length!==Object.keys(MODES).length)s.innerHTML=groups_.map(g=>`<optgroup label="${g}">${Object.entries(MODES).filter(([,x])=>x.group===g).map(([k,x])=>`<option value="${k}">${s.id==='modeSelM'?x.short:x.kind}</option>`).join('')}</optgroup>`).join('');s.value=mode});
  $('#bizName').textContent=m.biz;
  const groups=[...new Set(secs.map(s=>s.g))];
  $('#nav').innerHTML=groups.map(g=>`<div class="navgroup"><span>${g}</span>${secs.filter(s=>s.g===g).map(s=>`<button class="nav" data-act="go" data-tab="${s.k}" ${s.k===tab?'aria-current="page"':''}>${ic(s.ic,19)}<span>${s.l}</span>${badgeFor(s.k)}</button>`).join('')}</div>`).join('');
  const tb=TABBAR(),S_=k=>secs.find(s=>s.k===k),tabBtn=k=>`<button class="tab" data-act="go" data-tab="${k}" ${k===tab?'aria-current="page"':''}>${ic(S_(k).ic,22)}<span>${S_(k).s||S_(k).l}</span></button>`;
  const rc=relanceCount();
  $('#tabbar').innerHTML=tabBtn(tb[0])+tabBtn(tb[1])+`<button class="tab plus" data-act="quick" aria-label="Ajouter"><i>${ic('plus',24,2.2)}</i><span>Ajouter</span></button>`+tabBtn(tb[2])+`<button class="tab" data-act="more" ${tb.includes(tab)?'':'aria-current="page"'}>${ic('more',22)}<span>Plus</span>${rc?`<span class="badge">${rc}</span>`:''}</button>`;
  const sec=S_(tab);
  $('#pageTitle').textContent=tab==='dash'?m.biz:sec.l;
  $('#eyebrow').textContent=tab==='dash'?cap(dLong(iso(TODAY))):m.biz;
  const acts={
    dash:`<button class="btn primary only-desk" style="display:inline-flex" data-act="quick">${ic('plus',16,2.2)} Ajouter</button>`,
    resa:`<button class="btn primary" data-act="newbk">${ic('plus',16,2.2)} <span class="hide-m">${m.L.newResa}</span><span class="only-mob" style="display:none">Nouveau</span></button>`,
    clients:`<button class="btn primary" data-act="newcli">${ic('plus',16,2.2)} ${cap(m.L.client)}</button>`,
    compta:`<button class="btn" data-act="csv">${ic('copy',16)} <span class="hide-m">Export comptable</span><span class="only-mob" style="display:none">Export</span></button><button class="btn primary" data-act="newentry">${ic('plus',16,2.2)} Dépense</button>`,
    bilan:`<button class="btn" data-act="copybilan">${ic('copy',16)} Copier</button>`,
    tables:`<button class="btn" data-act="resetTables">Tout libérer</button>`,
    planning:`<button class="btn" data-act="copyplan">${ic('copy',16)} Partager</button>`
  };
  $('#topActions').innerHTML=acts[tab]||'';
  $('#view').innerHTML=V[tab]();
  save();
}

/* ---------- événements ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,m=M(),B=()=>S.bookings.find(b=>b.id===+id);
  switch(a){
    case 'go':closeSheet();tab=el.dataset.tab;try{history.replaceState(null,'','#'+tab)}catch(e){}render();window.scrollTo(0,0);break;
    case 'quick':quickSheet();break;
    case 'more':moreSheet();break;
    case 'sale':saleSheet();break;
    case 'reset':S=seed(mode);UI.month=iso(TODAY).slice(0,7);closeSheet();render();toast('Données d’exemple restaurées');break;
    case 'close':closeSheet();break;
    case 'day':UI.day=el.dataset.d;rerender();break;
    case 'staff':UI.staff=el.dataset.v;rerender();break;
    case 'month':UI.month=el.dataset.v;rerender();break;
    case 'cflt':UI.cflt=el.dataset.v;rerender();break;
    case 'clflt':UI.clflt=el.dataset.v;rerender();break;
    case 'bk':bookingSheet(B());break;
    case 'newbk':newBookingSheet({staff:el.dataset.staff,time:el.dataset.time});break;
    case 'newbkFor':newBookingSheet({name:el.dataset.name});break;
    case 'bstatus':{const b=B();b.status=el.dataset.s;if(b.status==='arrive'&&b.table){const t=S.tables.find(t=>t.id===b.table);if(t){t.status='occupee';t.since=toT(NOWMIN)}}bookingSheet(b);rerender();break}
    case 'bdel':{const b=B();S.bookings=S.bookings.filter(x=>x!==b);S.tables.forEach(t=>{if(t.booking===b.id){t.booking=null;if(t.status==='reservee')t.status='libre'}});closeSheet();rerender();toast('Supprimé');break}
    case 'table':UI.selTable=UI.selTable===el.dataset.id?null:el.dataset.id;rerender();break;
    case 'tstatus':{const t=S.tables.find(t=>t.id===UI.selTable);t.status=el.dataset.s;if(t.status==='occupee')t.since=toT(NOWMIN);if(t.status==='libre'||t.status==='nettoyer'){if(t.booking){const b=S.bookings.find(b=>b.id===t.booking);if(b&&t.status==='nettoyer')b.status='termine'}t.booking=null}rerender();break}
    case 'tpay':{const t=S.tables.find(t=>t.id===UI.selTable);const b=S.bookings.find(b=>b.id===t.booking)||{covers:t.seats};
      openSheet('Encaisser la table '+t.id,`<form data-form="tpay" class="stack"><div class="field"><label for="payAmt">Montant TTC</label><input type="number" step="0.01" min="0" id="payAmt" value="${r2((b.covers||2)*m.avg)}" required inputmode="decimal" style="font-size:22px;font-weight:700"></div><div class="field"><label for="payMode">Paiement</label><select id="payMode">${m.pay.map(p=>`<option>${p[0]}</option>`).join('')}</select></div><p class="muted small" style="margin:0">La table passe en « À débarrasser ».</p><button class="btn primary" type="submit" style="justify-content:center">${ic('cash',18)} Encaisser</button></form>`);break}
    case 'resetTables':S.tables.forEach(t=>{t.status='libre';t.booking=null;t.since=''});rerender();toast('Toutes les tables sont libres');break;
    case 'shift':{const s=el.dataset.s,d=+el.dataset.d;S.plan[s][d]=(S.plan[s][d]+1)%m.shifts.length;rerender();break}
    case 'copyplan':{const d0=dAdd(-wdi(TODAY));copy(`Planning ${m.biz}, semaine du ${d0.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}\n\n`+m.staff.map(s=>`${s} (${hfmt(hoursOf(s))})\n`+S.plan[s].map((v,i)=>m.closed.includes(i)?null:`  ${WD[i]} : ${m.shifts[v][0]}`).filter(Boolean).join('\n')).join('\n\n'));break}
    case 'client':clientSheet(S.clients.find(c=>c.id===+id));break;
    case 'visit':{const c=S.clients.find(c=>c.id===+id);c.visits++;c.last=iso(TODAY);if(TY()==='lecon')c.hours++;else c.spent=r2(c.spent+m.avg);clientSheet(c);rerender();toast(c.visits%10===0&&TY()!=='lecon'?'10e passage : '+m.reward:'Passage enregistré');break}
    case 'newcli':openSheet('Nouveau '+m.L.client,`<form data-form="cli" class="stack"><div class="field"><label for="cName">Nom et prénom</label><input type="text" id="cName" required autocomplete="off"></div><div class="field"><label for="cTel">Téléphone</label><input type="text" id="cTel" inputmode="tel" placeholder="06 12 34 56 78" autocomplete="off"></div><label class="toggle"><span><b>Accepte les SMS</b><span class="muted small">Consentement nécessaire pour les offres et relances (RGPD).</span></span><input type="checkbox" class="sw" id="cOpt" checked></label><button class="btn primary" type="submit" style="justify-content:center">Ajouter</button></form>`);break;

    case 'csv':{const L=ledger(UI.month);copy('date;libelle;categorie;sens;taux_tva;montant_ht;tva;montant_ttc;justificatif\n'+L.slice().reverse().map(e=>{const ht=e.ttc/(1+e.tva/100);return [e.date,e.label.replace(/;/g,','),e.cat,e.dir==='in'?'recette':'depense',String(e.tva).replace('.',','),ht.toFixed(2).replace('.',','),(e.ttc-ht).toFixed(2).replace('.',','),e.ttc.toFixed(2).replace('.',','),e.proof||''].join(';')}).join('\n'));break}

    case 'relInv':{const i=S.invoices.find(x=>x.id===+id);msgSheet('Relance · '+i.client,i.label+' · '+eur(i.amount),MSG.facture(i,i.level),'sentInv',i.id,`<button class="btn" data-act="paid" data-id="${i.id}">Elle a payé</button>`);break}
    case 'sentInv':{const i=S.invoices.find(x=>x.id===+id);i.level++;i.sentToday=true;S.log.unshift({date:iso(TODAY),type:'relance n°'+i.level,target:i.client});closeSheet();rerender();toast('Relance enregistrée');break}

    case 'relRdv':{const b=B();if(b.reminded){bookingSheet(b);break}msgSheet('Rappel · '+b.client,cap(relDay(b.date))+' à '+b.time,MSG.rdv(b),'sentRdv',b.id);break}
    case 'sentRdv':{const b=B();b.reminded=true;S.log.unshift({date:iso(TODAY),type:'rappel SMS',target:b.client});closeSheet();rerender();break}

    case 'relCli':{const c=S.clients.find(x=>x.id===+id);if(c.contacted){clientSheet(c);break}msgSheet('Message · '+c.name,'Dernière visite il y a '+(-diffDays(c.last))+' jours',MSG.inactif(c),'sentCli',c.id);break}
    case 'sentCli':{const c=S.clients.find(x=>x.id===+id);c.contacted=iso(TODAY);S.log.unshift({date:iso(TODAY),type:'offre de retour',target:c.name});closeSheet();rerender();break}
    case 'relAvis':{const c=S.clients.find(x=>x.id===+id);msgSheet('Avis · '+c.name,'Venu hier',MSG.avis(c),'sentAvis',c.id);break}
    case 'sentAvis':{const c=S.clients.find(x=>x.id===+id);c.avis=true;S.log.unshift({date:iso(TODAY),type:'demande d’avis',target:c.name});closeSheet();rerender();break}
    case 'copymsg':copy($('#msgTxt').value);break;
    case 'qty':{const s=S.stock.find(x=>x.id===+id),step=s.unit==='km'?100:1;s.qty=Math.max(0,s.qty+(+el.dataset.d)*step);rerender();break}
    case 'copyshop':{const low=lowStock();copy(`Commande ${m.biz}, ${dShort(iso(TODAY))}\n\n`+Object.entries(low.reduce((o,s)=>{(o[s.supplier]=o[s.supplier]||[]).push(s);return o},{})).map(([k,l])=>k+'\n'+l.map(s=>s.unit==='km'?'- '+s.item.replace(' — avant révision','')+' : révision':'- '+s.item+' : '+Math.max(s.min*2-s.qty,1)+' '+s.unit).join('\n')).join('\n\n'));break}
  }
});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeSheet()});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.classList.contains('modesel')){mode=el.value;loadMode();UI.month=iso(TODAY).slice(0,7);UI.staff='';UI.clflt='all';render();window.scrollTo(0,0);return}
  const a=el.dataset.actChange;
  if(a==='auto'){S.auto[el.dataset.k]=el.checked;save();toast(el.checked?'Activé':'Désactivé');const open=el.closest('details')?.open;rerender();if(open)document.querySelector('#view details')?.setAttribute('open','')}
  if(a==='tassign'){const t=S.tables.find(t=>t.id===UI.selTable),bid=+el.value;S.tables.forEach(x=>{if(x.booking===bid&&x!==t){x.booking=null;if(x.status==='reservee')x.status='libre'}});S.bookings.forEach(b=>{if(b.table===t.id)b.table=''});if(bid){const b=S.bookings.find(b=>b.id===bid);b.table=t.id;t.booking=bid;if(t.status==='libre')t.status='reservee'}else t.booking=null;rerender()}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){UI.q=ev.target.value;const pos=ev.target.selectionStart;rerender();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  if(ev.target.id==='msgTxt'){const n=ev.target.value.length;$('#msgLen').textContent=n+' caractères · '+Math.ceil(n/160)+' SMS'}
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target,k=f.dataset.form,m=M();
  if(k==='bk'){
    const srv=m.services.find(s=>s.n===$('#fSrv').value),staff=TY()==='resto'?'':$('#fStaff').value,date=$('#fDate').value,time=$('#fTime').value;
    if(staff&&S.bookings.some(b=>b.date===date&&b.staff===staff&&b.status!=='absent'&&toMin(time)<toMin(b.time)+b.dur&&toMin(b.time)<toMin(time)+srv.d)){toast(staff+' est déjà pris sur ce créneau');return}
    const name=$('#fCli').value.trim(),sms=$('#fSms').checked;
    S.bookings.push({id:nid(),date,time,dur:srv.d,client:name,service:srv.n,staff,covers:TY()==='resto'&&srv.n!=='Click & collect'?+$('#fCov').value:0,price:TY()==='resto'?+$('#fAmt').value||0:srv.p,status:'confirme',table:'',paid:false,reminded:false,note:$('#fNote').value,vehicle:m.vehicles?m.vehicles[staff]:''});
    if(!S.clients.some(c=>c.name===name))S.clients.push({id:nid(),name,phone:'—',visits:0,last:iso(TODAY),spent:0,contacted:null,avis:false,hours:0,pack:20,code:false,exam:null});
    UI.day=date;closeSheet();tab='resa';render();toast(sms?'Enregistré · SMS de confirmation prêt':'Enregistré');
  }
  if(k==='pay'){const b=S.bookings.find(b=>b.id===+f.dataset.id),amt=+$('#payAmt').value;b.paid=true;b.price=amt;if(b.date===iso(TODAY))b.status='termine';S.entries.push({id:nid(),date:iso(TODAY),label:b.client+' — '+b.service+' ('+$('#payMode').value+')',cat:'Ventes',dir:'in',ttc:amt,tva:m.tva,proof:'ticket de caisse'});const c=S.clients.find(c=>c.name===b.client);if(c){c.spent=r2(c.spent+amt);c.last=iso(TODAY);if(TY()!=='lecon')c.visits++}closeSheet();rerender();toast(eur(amt)+' encaissés')}
  if(k==='sale'){const amt=+$('#sAmt').value,pm=f.querySelector('input[name=sPay]:checked').value,lab=$('#sLab').value.trim();S.entries.push({id:nid(),date:iso(TODAY),label:(lab||'Vente comptoir')+' ('+pm+')',cat:'Ventes',dir:'in',ttc:amt,tva:m.tva,proof:'ticket de caisse'});closeSheet();rerender();toast(eur(amt)+' encaissés')}
  if(k==='tpay'){const t=S.tables.find(t=>t.id===UI.selTable),amt=+$('#payAmt').value,b=S.bookings.find(b=>b.id===t.booking);S.entries.push({id:nid(),date:iso(TODAY),label:'Table '+t.id+(b?' — '+b.client:'')+' ('+$('#payMode').value+')',cat:'Ventes',dir:'in',ttc:amt,tva:m.tva,proof:'ticket de caisse'});if(b){b.status='termine';b.paid=true;b.price=amt}t.status='nettoyer';t.booking=null;closeSheet();rerender();toast(eur(amt)+' encaissés · table '+t.id+' à débarrasser')}
  if(k==='entry'){const ex=f.dataset.id?S.entries.find(e=>e.id===+f.dataset.id):null,file=$('#eProof').files[0];
    const o={date:$('#eDate').value,label:$('#eLab').value.trim(),cat:$('#eCat').value,dir:$('#eDir').value,ttc:+$('#eAmt').value,tva:+$('#eTva').value,proof:file?file.name:(ex?ex.proof:'')};
    if(ex)Object.assign(ex,o);else S.entries.push({id:nid(),...o});UI.month=o.date.slice(0,7);closeSheet();rerender();toast('Enregistré')}
  if(k==='cli'){const n=$('#cName').value.trim();S.clients.push({id:nid(),name:n,phone:$('#cTel').value||'—',visits:0,last:iso(TODAY),spent:0,contacted:null,avis:false,hours:0,pack:20,code:false,exam:null});closeSheet();rerender();toast(n+' ajouté')}
});

loadMode();render();
</script>

</body></html>
